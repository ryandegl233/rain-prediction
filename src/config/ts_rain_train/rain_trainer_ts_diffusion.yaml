hydra:
  output_subdir: hydra_config
  run:
    dir: runs/time_series_diffusion/${now:%Y-%m-%d}/${now:%H-%M-%S}_${train.log.run_comment}

defaults:
  - rain_prediction_model: causal_patch_transformer_diffusion
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

accelerator:
  _target_: accelerate.Accelerator
  mixed_precision: bf16
  log_with: tensorboard
  dataloader_config:
    _target_: accelerate.utils.DataLoaderConfiguration
    split_batches: false
    even_batches: false
    non_blocking: true
    dispatch_batches: null
    use_seedable_sampler: true
    use_stateful_dataloader: false
  project_config:
    _target_: accelerate.utils.ProjectConfiguration
    project_dir: runs/time_series_diffusion/
    logging_dir: runs/time_series_diffusion/tensorboard
    total_limit: 3
    automatic_checkpoint_naming: true
  gradient_accumulation_plugin:
    _target_: accelerate.utils.GradientAccumulationPlugin
    num_steps: 1
    adjust_scheduler: true
    sync_with_dataloader: false
    sync_each_batch: false

ema:
  beta: 0.999
  update_after_step: 1000
  update_every: 1

dataset:
  n_past: 4
  n_futures: 1
  img_size: 512
  time_interval: 30
  train_inp_dirs:
    - data2/litdata_train_2025/litdata_interval_30/202305
    - data2/litdata_train_2025/litdata_interval_30/202306
    - data2/litdata_train_2025/litdata_interval_30/202307
    - data2/litdata_train_2025/litdata_interval_30/202308
    - data2/litdata_train_2025/litdata_interval_30/202309
    - data2/litdata_train_2025/litdata_interval_30/202506
    - data2/litdata_train_2025/litdata_interval_30/202507
  val_inp_dirs:
    - data2/litdata_train_2025/litdata_interval_30/202508
    - data2/litdata_train_2025/litdata_interval_30/202509
  rain_norm:
    mean: 0.004600618807
    std: 0.047935366050
  modality_zero_centering: true
  value_clip:
    enabled: true
    radar_min: 0.0
    radar_max: 60.0
    satellite_min: 0.0
    satellite_max: 300.0
    rain_min: 0.0
    rain_max: null

  train:
    _target_: src.dataset.rain_ts_litdata.get_litdata_rain_ts_dataloader
    inp_dirs: ${dataset.train_inp_dirs}
    time_interval: ${dataset.time_interval}
    n_past: ${dataset.n_past}
    n_futures: ${dataset.n_futures}
    img_resize: ${dataset.img_size}
    stack_data: true
    index_file_name: null
    modality_zero_centering: ${dataset.modality_zero_centering}
    rain_norm_mean: ${dataset.rain_norm.mean}
    rain_norm_std: ${dataset.rain_norm.std}
    clip_values: ${dataset.value_clip.enabled}
    radar_clip_min: ${dataset.value_clip.radar_min}
    radar_clip_max: ${dataset.value_clip.radar_max}
    satellite_clip_min: ${dataset.value_clip.satellite_min}
    satellite_clip_max: ${dataset.value_clip.satellite_max}
    rain_clip_min: ${dataset.value_clip.rain_min}
    rain_clip_max: ${dataset.value_clip.rain_max}
    batching_method: per_stream
    iterate_over_all: true
    is_cycled: false
    use_streaming_loader: true
    batch_size: 2
    shuffle: true
    num_workers: 4
    persistent_workers: true
    pin_memory: false
    drop_last: true
    prefetch_factor: 2

  val:
    _target_: src.dataset.rain_ts_litdata.get_litdata_rain_ts_dataloader
    inp_dirs: ${dataset.val_inp_dirs}
    time_interval: ${dataset.time_interval}
    n_past: ${dataset.n_past}
    n_futures: ${dataset.n_futures}
    img_resize: ${dataset.img_size}
    stack_data: true
    index_file_name: null
    modality_zero_centering: ${dataset.modality_zero_centering}
    rain_norm_mean: ${dataset.rain_norm.mean}
    rain_norm_std: ${dataset.rain_norm.std}
    clip_values: ${dataset.value_clip.enabled}
    radar_clip_min: ${dataset.value_clip.radar_min}
    radar_clip_max: ${dataset.value_clip.radar_max}
    satellite_clip_min: ${dataset.value_clip.satellite_min}
    satellite_clip_max: ${dataset.value_clip.satellite_max}
    rain_clip_min: ${dataset.value_clip.rain_min}
    rain_clip_max: ${dataset.value_clip.rain_max}
    batching_method: per_stream
    iterate_over_all: true
    is_cycled: false
    use_streaming_loader: true
    batch_size: 4
    shuffle: true
    num_workers: 1
    persistent_workers: true
    pin_memory: false
    drop_last: true
    prefetch_factor: 2

train:
  seed: 2025
  max_steps: 100000
  proj_dir: null
  save_every: 1000
  resume_path: #runs/time_series_diffusion/2026-04-07/16-43-58_stage1_teacher_forcing_diffusion/checkpoints/checkpoint_1
  max_grad_norm: 1.0
  strict_target_isolation: true
  prediction_target: flow

  teacher_forcing:
    target_mode: next_frame
    block_size: 1
    context_noise_max_timestep: 0

  diffusion:
    scheduler_type: flow_match
    num_train_timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02
    min_timestep: 0
    max_timestep: 999
    fm_shift: 3.0
    fm_sigma_max: 1.0
    fm_sigma_min: 0.0029940119760479044
    fm_inverse_timesteps: false
    fm_extra_one_step: false
    fm_reverse_sigmas: false

  loss_weights:
    radar: 1.0
    satellite: 4.0
    rain: 1.0

  optim:
    _target_: src.utils.optim.MuonFSDP.create_muon_optimizer
    _partial_: true
    betas: [0.9, 0.95]
    mu: 0.95
    oned_param_algo: adamw
    ns_algorithm: gram_newton_schulz
    use_triton: false
    use_preconditioned: false # turbo-muon style preconditioning
    muon_params_defaults:
      lr: 4.0e-4
      weight_decay: 0.1
    oned_params_defaults:
      lr: 3.0e-4
      weight_decay: 0.0


  scheduler:
    _target_: src.utils.train_utils.lr_scheduler.get_cosine_schedule_reduced_with_warmup
    _partial_: true
    num_warmup_steps: 0
    num_training_steps: ${train.max_steps}
    num_cycles: 1
    reduced_factor: 2
    min_lr: 1.0e-5

  log:
    run_comment: stage1_teacher_forcing_diffusion
    log_with_time: true
    log_every: 10

  debug: false

val:
  val_duration: 200
  max_val_iters: 10
  inference_sampler: fm_dpmpp # gaussian: ddpm/ddim; fm: fm_euler/fm_dpmpp/fm_unipc
  num_inference_steps: 25
  metric_data_range: 1.0
  csi_thresholds: [0.1, 0.3, 0.5]
  clip_pred_x0: false
  save_visuals: true
  show_sample_progress: true
  viz_sample_index: 0
  viz_frame_indices: [0]
  viz_satellite_channel: 0
