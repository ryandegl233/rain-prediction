hydra:
  output_subdir: hydra_config
  run:
    dir: runs/tempo_rain_v4/${now:%Y-%m-%d}/${now:%H-%M-%S}_${train.log.run_comment}

defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# 模型参数直接写在本训练配置中，不依赖 config/rain_prediction_model 目录。
# input_size=256 只定义可学习位置编码的基准网格；模型会在运行时插值到512。
rain_prediction_model:
  _target_: src.networks.time_series.causal_patch_transformer_next_frame_tempo_v4.RainCausalPatchTransformerNextFrame
  in_channels: 12
  out_channels: 1
  radar_out_channels: 1
  satellite_out_channels: 10
  rain_out_channels: 1
  input_size: 256
  patch_size: 4
  stem_channels: 128
  dim: 512
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  drop_path: 0.1
  max_frames: 32
  decoder_base_channels: 256
  use_spatial_rope_2d: false
  use_temporal_rope_1d: false
  rope_theta_spatial: 10000.0
  rope_theta_temporal: 10000.0
  rope_fraction_spatial: 1.0
  rope_fraction_temporal: 1.0
  decoder_type: 3d
  frame_patch_size: 1
  encoder_type: patch
  encoder_spatial_downsample_stages: 0
  encoder_temporal_downsample_stages: 0
  encoder_causal: true
  encoder_conv_style: wan_factorized
  use_modality_mask_token: true
  stem_pad_mode: zeros
  decoder_pad_mode: zeros
  decoder_upsample_mode: nearest_conv
  decoder_k_size: null
  decoder_causal: true
  decoder_condition_mode: none
  decoder_output_mode: pixels
  use_time_embedding: true
  activation_checkpoint: true
  cross_modal_adapter_enabled: false
  cross_modal_adapter_heads: null
  local_window_refiner_enabled: false
  local_window_size: 7
  local_window_heads: null

  # TEMPO: direct forecast + differentiable advection + source/sink + gate.
  tempo_enabled: true
  tempo_head_channels: 16
  tempo_event_thresholds: [0.1, 0.3, 0.5]
  tempo_max_flow_pixels: 24.0
  tempo_source_scale: 1.0
  tempo_nonnegative_rain: true
  tempo_rain_min_value: 0.0
  tempo_confidence_init_bias: -2.0

accelerator:
  _target_: accelerate.Accelerator
  mixed_precision: bf16
  log_with: tensorboard
  dataloader_config:
    _target_: accelerate.utils.DataLoaderConfiguration
    split_batches: false
    even_batches: false
    non_blocking: true
    dispatch_batches: null
    use_seedable_sampler: true
    use_stateful_dataloader: false
  project_config:
    _target_: accelerate.utils.ProjectConfiguration
    project_dir: runs/tempo_rain_v4/
    logging_dir: runs/tempo_rain_v4/tensorboard
    total_limit: 3
    automatic_checkpoint_naming: true
  gradient_accumulation_plugin:
    _target_: accelerate.utils.GradientAccumulationPlugin
    num_steps: 8
    adjust_scheduler: true
    sync_with_dataloader: false
    sync_each_batch: false

ema:
  beta: 0.999
  update_after_step: 1000
  update_every: 1

dataset:
  n_past: 3
  n_futures: 10
  img_size: 512

  # 当前 litdata_interval_30 表示30分钟/帧，因此10帧是未来5小时。
  # 如果目标是未来50分钟，应重新使用10分钟对齐数据并改成 time_interval=10、n_futures=5。
  time_interval: 30

  train_inp_dirs:
    - data2/litdata_train_2025/litdata_interval_30/202305
    - data2/litdata_train_2025/litdata_interval_30/202306
    - data2/litdata_train_2025/litdata_interval_30/202307
    - data2/litdata_train_2025/litdata_interval_30/202308
    - data2/litdata_train_2025/litdata_interval_30/202309
    - data2/litdata_train_2025/litdata_interval_30/202506
    - data2/litdata_train_2025/litdata_interval_30/202507
  val_inp_dirs:
    - data2/litdata_train_2025/litdata_interval_30/202508
    - data2/litdata_train_2025/litdata_interval_30/202509

  rain_norm:
    mean: 0.004600618807
    std: 0.047935366050
  modality_zero_centering: false

  value_clip:
    enabled: true
    radar_min: 0.0
    radar_max: 60.0
    satellite_min: 0.0
    satellite_max: 300.0
    rain_min: 0.0
    rain_max: null

  # 不再硬删除干旱样本。真正的分层采样需要在 dataset/sampler 中实现。
  rain_ratio_filter:
    enabled: false
    file_name: metadata_rain_ratio.parquet
    column: rain_ratio_gt_0p02
    min_value: 0.02
    mode: future_any

  # Four-bucket temporal-window sampling. This preserves dry cases instead of
  # deleting them and oversamples rare rainy windows only inside the train set.
  # Boundaries are wet-area fractions from rain_ratio_gt_0p02, not rain rates.
  stratified_sampling:
    enabled: true
    file_name: metadata_rain_ratio.parquet
    column: rain_ratio_gt_0p02
    boundaries: [0.001, 0.01, 0.05]
    probs: [0.25, 0.35, 0.25, 0.15]
    score_mode: future_max
    seed: ${train.seed}

  augmentation:
    train_enabled: true
    val_enabled: false
    random_crop_prob: 0.5
    random_crop_min_scale: 0.8
    random_crop_max_scale: 1.0
    random_crop_keep_size: true
    temporal_reverse_prob: 0.0

  train:
    _target_: src.dataset.rain_ts_litdata_tempo_v4.get_litdata_rain_ts_dataloader
    inp_dirs: ${dataset.train_inp_dirs}
    time_interval: ${dataset.time_interval}
    n_past: ${dataset.n_past}
    n_futures: ${dataset.n_futures}
    img_resize: ${dataset.img_size}
    stack_data: true
    index_file_name: null
    modality_zero_centering: ${dataset.modality_zero_centering}
    rain_norm_mean: ${dataset.rain_norm.mean}
    rain_norm_std: ${dataset.rain_norm.std}
    clip_values: ${dataset.value_clip.enabled}
    radar_clip_min: ${dataset.value_clip.radar_min}
    radar_clip_max: ${dataset.value_clip.radar_max}
    satellite_clip_min: ${dataset.value_clip.satellite_min}
    satellite_clip_max: ${dataset.value_clip.satellite_max}
    rain_clip_min: ${dataset.value_clip.rain_min}
    rain_clip_max: ${dataset.value_clip.rain_max}
    rain_ratio_filter_enabled: ${dataset.rain_ratio_filter.enabled}
    rain_ratio_filter_file_name: ${dataset.rain_ratio_filter.file_name}
    rain_ratio_filter_column: ${dataset.rain_ratio_filter.column}
    rain_ratio_filter_min_value: ${dataset.rain_ratio_filter.min_value}
    rain_ratio_filter_mode: ${dataset.rain_ratio_filter.mode}
    stratified_sampling_enabled: ${dataset.stratified_sampling.enabled}
    stratified_sampling_file_name: ${dataset.stratified_sampling.file_name}
    stratified_sampling_column: ${dataset.stratified_sampling.column}
    stratified_sampling_boundaries: ${dataset.stratified_sampling.boundaries}
    stratified_sampling_probs: ${dataset.stratified_sampling.probs}
    stratified_sampling_score_mode: ${dataset.stratified_sampling.score_mode}
    stratified_sampling_seed: ${dataset.stratified_sampling.seed}
    aug_enabled: ${dataset.augmentation.train_enabled}
    aug_random_crop_prob: ${dataset.augmentation.random_crop_prob}
    aug_random_crop_min_scale: ${dataset.augmentation.random_crop_min_scale}
    aug_random_crop_max_scale: ${dataset.augmentation.random_crop_max_scale}
    aug_random_crop_keep_size: ${dataset.augmentation.random_crop_keep_size}
    aug_temporal_reverse_prob: ${dataset.augmentation.temporal_reverse_prob}
    batching_method: per_stream
    iterate_over_all: true
    is_cycled: false
    use_streaming_loader: true
    batch_size: 1
    shuffle: false
    num_workers: 4
    persistent_workers: true
    pin_memory: true
    drop_last: true
    prefetch_factor: 2
    iter_index_mode: sequential

  val:
    _target_: src.dataset.rain_ts_litdata_tempo_v4.get_litdata_rain_ts_dataloader
    inp_dirs: ${dataset.val_inp_dirs}
    time_interval: ${dataset.time_interval}
    n_past: ${dataset.n_past}
    n_futures: ${dataset.n_futures}
    img_resize: ${dataset.img_size}
    stack_data: true
    index_file_name: null
    modality_zero_centering: ${dataset.modality_zero_centering}
    rain_norm_mean: ${dataset.rain_norm.mean}
    rain_norm_std: ${dataset.rain_norm.std}
    clip_values: ${dataset.value_clip.enabled}
    radar_clip_min: ${dataset.value_clip.radar_min}
    radar_clip_max: ${dataset.value_clip.radar_max}
    satellite_clip_min: ${dataset.value_clip.satellite_min}
    satellite_clip_max: ${dataset.value_clip.satellite_max}
    rain_clip_min: ${dataset.value_clip.rain_min}
    rain_clip_max: ${dataset.value_clip.rain_max}
    rain_ratio_filter_enabled: false
    rain_ratio_filter_file_name: ${dataset.rain_ratio_filter.file_name}
    rain_ratio_filter_column: ${dataset.rain_ratio_filter.column}
    rain_ratio_filter_min_value: ${dataset.rain_ratio_filter.min_value}
    rain_ratio_filter_mode: ${dataset.rain_ratio_filter.mode}
    stratified_sampling_enabled: false
    stratified_sampling_file_name: ${dataset.stratified_sampling.file_name}
    stratified_sampling_column: ${dataset.stratified_sampling.column}
    stratified_sampling_boundaries: ${dataset.stratified_sampling.boundaries}
    stratified_sampling_probs: ${dataset.stratified_sampling.probs}
    stratified_sampling_score_mode: ${dataset.stratified_sampling.score_mode}
    stratified_sampling_seed: ${dataset.stratified_sampling.seed}
    aug_enabled: false
    aug_random_crop_prob: 0.0
    aug_random_crop_min_scale: 1.0
    aug_random_crop_max_scale: 1.0
    aug_random_crop_keep_size: true
    aug_temporal_reverse_prob: 0.0
    batching_method: per_stream
    iterate_over_all: true
    is_cycled: false
    use_streaming_loader: true
    batch_size: 1
    shuffle: false
    num_workers: 1
    persistent_workers: true
    pin_memory: false
    drop_last: false
    prefetch_factor: 2
    iter_index_mode: sequential

train:
  seed: 2025
  max_steps: 100000
  proj_dir: null
  save_every: 1000
  resume_path:
  init_model_path:
  max_grad_norm: 1.0
  strict_target_isolation: false

  next_pred:
    target_mode: next_frame

    sequence_loss:
      enabled: true
      context_weight: 0.2
      future_weight: 1.0

    rollout_branch:
      enabled: true
      mode: frame
      # fallback value for legacy checkpoints; stages below override it during training
      weight: 0.5
      rollout_frames: ${dataset.n_futures}
      rollout_block_size: 1
      detach_history: true
      use_gt_future_modalities: false
      loss_on: all

      # At 512x512, keeping ten complete AR graphs is prohibitively expensive.
      # Intermediate leads still participate in rollout feedback, but gradients
      # are retained at these anchor leads and at every stage's current last lead.
      gradient_leads: [1, 2, 5, 10]

      # TEMPO staged curriculum: rollout difficulty and loss weight change together.
      stages:
        - name: rollout_warmup
          start_step: 0
          end_step: 5000
          start_frames: 2
          end_frames: 2
          start_prob: 1.0
          end_prob: 0.8
          start_weight: 0.2
          end_weight: 0.2
          schedule: cosine

        - name: short_rollout
          start_step: 5000
          end_step: 25000
          start_frames: 2
          end_frames: 5
          start_prob: 0.8
          end_prob: 0.4
          start_weight: 0.2
          end_weight: 0.5
          schedule: cosine

        - name: long_rollout
          start_step: 25000
          end_step: 50000
          start_frames: 5
          end_frames: ${dataset.n_futures}
          start_prob: 0.4
          end_prob: 0.0
          start_weight: 0.5
          end_weight: 1.0
          schedule: cosine

        - name: full_self_feedback
          start_step: 50000
          end_step: ${train.max_steps}
          start_frames: ${dataset.n_futures}
          end_frames: ${dataset.n_futures}
          start_prob: 0.0
          end_prob: 0.0
          start_weight: 1.0
          end_weight: 1.0
          schedule: linear

      scheduled_sampling:
        enabled: true
        # Stage start_prob/end_prob override these legacy fallback values.
        start_prob: 1.0
        end_prob: 0.0
        start_step: 0
        end_step: ${train.max_steps}
        schedule: cosine
        modalities: [radar, satellite, rain]

      delta_loss:
        enabled: false
        weight: 0.0

    missing_modality:
      enabled: true
      drop_probs:
        radar: 0.05
        satellite: 0.05
        rain: 0.0
      min_available_modalities: 2

  loss_weights:
    radar: 1.0
    satellite: 1.0
    rain: 2.0

  loss:
    mode: enhanced
    regression_base: huber
    huber_beta: 0.1

    # All event/CSI/FSS thresholds below use de-normalized rain units when
    # modality_zero_centering=true, otherwise they use dataset-native rain units.
    # Verify these numbers against mm/interval or mm/h before the paper experiment.
    threshold_space: physical

    lead_time_weight:
      enabled: true
      start_weight: 1.0
      end_weight: 2.0
      power: 1.5

    rain_region_weight:
      enabled: true
      alpha: 1.0
      r0: 0.1
      gamma: 1.0
      max_weight: 3.0
      normalize: true

    rain_event_aux:
      enabled: true
      weight: 0.15
      thresholds: [0.1, 0.3, 0.5]
      type: focal
    # The v4 Patch Transformer exposes an explicit ordered multi-threshold event head.
      head_mode: model
      logit_scale: 10.0
      focal_gamma: 2.0
      focal_alpha: 0.65
      ordinal_weight: 0.05

    soft_csi:
      enabled: true
      apply_on: rollout
      weight: 0.20
      thresholds: [0.1, 0.3, 0.5]
      temperature: 0.03
      eps: 1.0e-6

    soft_fss:
      enabled: true
      apply_on: rollout
      weight: 0.10
      thresholds: [0.1, 0.3]
      windows: [3, 9]
      temperature: 0.03
      eps: 1.0e-6

    spectral_amplitude:
      enabled: true
      apply_on: rollout
      weight: 0.02
      max_size: 128
      log1p: true

    # Supervise the v4 transport/evolution decomposition and fail immediately if
    # the wrong model configuration is accidentally loaded.
    model_auxiliary:
      enabled: true
      apply_on: rollout
      weight: 1.0
      require_outputs: true
      expected_outputs: [rain_direct, rain_advected, rain_source, rain_transport, flow, flow_confidence, rain_event_logits]
      direct_weight: 0.10
      advection_weight: 0.05
      transport_weight: 0.20
      composition_weight: 0.05
      source_sparsity_weight: 0.01
      flow_smoothness_weight: 0.01

    rain_residual:
      enabled: false
      delta_weight: 0.0
      clamp_output: true
      min_value: 0.0

    temporal_diff:
      enabled: true
      apply_on: rain
      weight_init: 0.0
      weight_max: 0.05
      warmup_steps: 10000
      radar_guided:
        enabled: false
        alpha: 0.5
        echo_beta: 0.5
        eps: 1.0e-6
        max_weight: 3.0

  optim:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 1.0e-4

  scheduler:
    _target_: src.utils.train_utils.lr_scheduler.get_cosine_schedule_reduced_with_warmup
    _partial_: true
    num_warmup_steps: 1000
    num_training_steps: ${train.max_steps}
    num_cycles: 1
    reduced_factor: 2
    min_lr: 1.0e-5

  log:
    run_comment: tempo_v4_patch_transformer_transport_softcsi
    log_with_time: true
    log_every: 10

  debug: false

val:
  val_duration: 1000
  max_val_iters: 200
  metric_data_range: 1.0
  csi_thresholds: [0.1, 0.3, 0.5]
  fss_thresholds: [0.1, 0.3]
  fss_windows: [3, 9]
  use_ema: true
  rollout_mode: frame
  rollout_block_size: 1
  rollout_history_detach: true
  rollout_use_gt_future_modalities: false
  save_visuals: true
  viz_sample_index: 0
  after_roll_next:
    enabled: false
    roll_frames: 1
    detach_history: true
