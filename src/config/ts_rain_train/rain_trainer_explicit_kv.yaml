defaults:
  - rain_trainer_band_occurrence
  - _self_

accelerator:
  gradient_accumulation_plugin:
    num_steps: 8

dataset:
  train:
    batch_size: 1

rain_prediction_model:
  _target_: src.networks.time_series.causal_patch_transformer_explicit_kv.RainCausalPatchTransformerExplicitKV
  correction_kv_heads: 2
  correction_radius: 1
  correction_max_relative_time: 16
  correction_query_chunk_size: 128
  correction_scale_init: 0.1
  correction_recompute: true

train:
  init_model_path: /home/rainpred/RainPrediction/runs/band_occurrence_4090_Ua2RIh/training/checkpoints/checkpoint_6
  max_steps: 500
  save_every: 100
  validate_before_training: true
  log:
    run_comment: explicit_kv_3x3
  scheduler:
    num_warmup_steps: 25
    num_training_steps: ${train.max_steps}
  soft_occurrence:
    max_suppression: 0.15

val:
  val_duration: 100
  max_val_iters: 60
