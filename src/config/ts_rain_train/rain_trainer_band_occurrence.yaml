defaults:
  - rain_trainer_soft_occurrence
  - _self_

accelerator:
  gradient_accumulation_plugin:
    num_steps: 4

dataset:
  train:
    batch_size: 2

rain_prediction_model:
  _target_: src.networks.time_series.causal_patch_transformer_band_occurrence.RainCausalPatchTransformerBandOccurrence
  occurrence_gate_gamma: ${train.soft_occurrence.gate_gamma}
  occurrence_band_lower_mm_min: ${train.soft_occurrence.band_lower_mm_min}
  occurrence_band_upper_mm_min: ${train.soft_occurrence.band_upper_mm_min}
  occurrence_max_suppression: ${train.soft_occurrence.max_suppression}

train:
  max_steps: 1200
  save_every: 200
  optim:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 1.0e-4
  scheduler:
    _target_: src.utils.train_utils.lr_scheduler.get_cosine_schedule_reduced_with_warmup
    _partial_: true
    num_warmup_steps: 50
    num_training_steps: ${train.max_steps}
    num_cycles: 0.5
    reduced_factor: 2
    min_lr: 0.1
  log:
    run_comment: band_occurrence
  soft_occurrence:
    threshold_mm_min: 0.01
    strong_threshold_mm_min: 0.1
    false_positive_weight: 2.0
    loss_weight: 0.002
    strong_weight: 2.0
    pod_floor: 0.80
    pod_floor_weight: 2.0
    gate_gamma: 1.0
    gate_start_step: 100
    gate_ramp_steps: 200
    band_lower_mm_min: 0.01
    band_upper_mm_min: 0.1
    max_suppression: 0.5
    sweep_suppressions: [0.25, 0.5, 0.75]

val:
  val_duration: 200
