defaults:
  - rain_trainer_ts_next_frame_missing_modality
  - _self_

hydra:
  run:
    dir: runs/next_frame_final_stage2_usegt/${now:%Y-%m-%d}/${now:%H-%M-%S}_${train.log.run_comment}

accelerator:
  project_config:
    project_dir: runs/next_frame_final_stage2_usegt/
    logging_dir: runs/next_frame_final_stage2_usegt/tensorboard

dataset:
  train:
    # Keep batch_size=2 to stay comfortably within remaining GPU 0 VRAM alongside the 10-min run.
    batch_size: 2

train:
  max_steps: 25000
  save_every: 1000
  checkpoint:
    keep_recent: 2
    archive_every: 5
  resume_path: null
  init_model_path: /home/dongchenwang/RainPrediction/runs/next_frame_final/2026-11-07/18-43-55_stage1_next_frame_missing_modality/checkpoints/step_00060000/model.safetensors

  next_pred:
    rollout_branch:
      use_gt_future_modalities: true
      detach_rain_anchor: true
      detach_history: true

  optim:
    lr: 5.0e-5

  scheduler:
    num_training_steps: ${train.max_steps}
    min_lr: 1.0e-6

  log:
    run_comment: stage2_usegt_from_60k

val:
  val_duration: 1000
  rollout_use_gt_future_modalities: true
