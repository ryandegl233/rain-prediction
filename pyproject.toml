[project]
name = "rain_fusion_prediction"
version = "0.1.0"
description = "Sichuan province rain fusion prediction"
authors = [{ name = "Zihan Cao", email = "iamzihan666@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "requests>=2.26.0",
    "torch",
    "torchvision",
    "deepspeed",
    "accelerate",
    "transformers>=4.15.0",
    "webdataset",
    "xarray",
    "h5py",
    "pillow",
    "opencv-python",
    "pyyaml",
    "scikit-image",
    "scikit-learn>=0.24.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
test = ["pytest>=6.0", "pytest-cov>=2.0"]
dev = ["ruff", "flake8>=3.9"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
extend-exclude = [
    ".vscode",
    ".idea",
    "__pycache__",
    ".python-version",
    ".ruff.toml",
    "ruff.toml",
    "setup.cfg",
    "pyproject.toml",
]
exclude = [
    "src/stage2/generative/maskbit",
    "src/stage2/generative/Sana",
    "**/datasets/**",
    "data/",
    "src/stage2/generative/models/modules/deformable_attn/ops",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 20

[tool.ruff.lint]
select = ["E501", "I", "E", "W"]
ignore = [
    "E402",
    "D103",
    "I001",
    "E731",
    "E741",
    "D202",
    "D403",
    "E731",
    "E501",
    "PLR0913",
    "W291",
    "E722",
    "W293",
    "E701",
]

[tool.ruff.lint.pylint]
max-args = 20
max-bool-expr = 10
max-branches = 100
max-locals = 15
max-nested-blocks = 5
max-positional-args = 10
max-public-methods = 30
max-returns = 10
max-statements = 1000

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10
