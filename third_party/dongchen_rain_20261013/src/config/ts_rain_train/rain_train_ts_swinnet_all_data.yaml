hydra:
  output_subdir: null
  run:
    dir: .
defaults:
  - rain_prediction_model: swinnet
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

rain_prediction_model:
  n_past: ${dataset.n_past}
  input_resolution:
    - ${dataset.img_size}
    - ${dataset.img_size}
  output_frames: ${dataset.n_futures}

accelerator:
  _target_: accelerate.Accelerator
  mixed_precision: bf16
  log_with: tensorboard
  dataloader_config:
    _target_: accelerate.utils.DataLoaderConfiguration
    split_batches: False
    even_batches: False
    non_blocking: True
    dispatch_batches: None
    use_seedable_sampler: true
    use_stateful_dataloader: false
  project_config:
    _target_: accelerate.utils.ProjectConfiguration
    project_dir: runs/swinnet_cls_10min_AR
    logging_dir: runs/swinnet_cls_10min_AR/tensorboard
    total_limit: 3
    automatic_checkpoint_naming: true
  gradient_accumulation_plugin:
    _target_: accelerate.utils.GradientAccumulationPlugin
    num_steps: 1
    adjust_scheduler: true
    sync_with_dataloader: false
    sync_each_batch: false

ema:
  beta: 0.999
  update_after_step: 1000
  update_every: 1

dataset:
  n_past: 5
  n_futures: 5
  # 2km -> 1km: 空间分辨率翻倍，网格边长通常需要 x2
  # 例如 256 -> 512
  img_size: 256
  time_interval: 10
  center_latlon: [26.0, 106.0] 
  patch_size: 256

  train:
    _target_: src.dataset.rain_ts_litdata_swinnet.get_dataloader
    data_dirs: 
    #- /home/rainpred/RainPrediction/DATA/litdata_interval_5_ndarray/202305
    #- /home/rainpred/RainPrediction/DATA/litdata_interval_5_ndarray/202306
    #- /home/rainpred/RainPrediction/DATA/litdata_interval_5_ndarray/202307
    #- /home/rainpred/RainPrediction/DATA/litdata_interval_5_ndarray/202308
    #- /home/rainpred/RainPrediction/DATA/litdata_interval_5_ndarray/202309
    #- /home/rainpred/RainPrediction/DATA/litdata_interval_5_ndarray/202310
    #- /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202305 #数据有问题？meta202305: metadata=4095，pairs=4
    - /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202306
    - /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202307
    - /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202308
    - /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202309
    - /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202506
    - /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202507
    - /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202508
   #- /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202509   #10月测试

    time_interval: ${dataset.time_interval}
    n_past: ${dataset.n_past}
    n_futures: ${dataset.n_futures}
    img_resize: ${dataset.img_size}
    batch_size: 2
    num_workers: 6
    prefetch_factor: 1
    persistent_workers: true
    shuffle: true          
    
    # 自定义定点与筛选参数
    center_latlon: ${dataset.center_latlon}
    patch_size: ${dataset.patch_size}
    
    # 筛选 
    is_train: true       
    min_rain: 0.1           
    min_ratio: 0.03          # 避免有效样本过少
    cache_dir: "/home/rainpred/RainPrediction/__cache__swinnet__train/10min"    # 筛选结果缓存位置
    validate_cache: true
    cache_validate_sample_size: 64
    cache_validate_min_ok_ratio: 0.2

  val:
    _target_: src.dataset.rain_ts_litdata_swinnet.get_dataloader
    data_dirs:
      - /Data2/ZihanCao/RainDataset2025/litdata_train_2023_2025/litdata_interval_10/202509
    center_latlon: ${dataset.center_latlon}
    patch_size: ${dataset.patch_size}
    n_past: ${dataset.n_past}
    time_interval: ${dataset.time_interval}
    n_futures: ${dataset.n_futures}
    img_resize: ${dataset.img_size}
    batch_size: 8
    num_workers: 2
    prefetch_factor: 1
    persistent_workers: true
    shuffle: false

    is_train: true
    min_rain: 0.1
    min_ratio: 0.03

train:
  max_steps: 100_000
  proj_dir: runs/swinnet_cls_10min_AR
  save_every: 1000
  max_grad_norm: 0.3
  is_finetune: false
  resume_path: 
  ema_load_path: 

  optim:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1.0e-4
    weight_decay: 1.0e-6
    foreach: true

  scheduler:
    _target_: src.utils.train_utils.lr_scheduler.get_cosine_schedule_reduced_with_warmup
    _partial_: true
    num_warmup_steps: 0
    num_training_steps: ${train.max_steps}
    num_cycles: 1
    reduced_factor: 2
    min_lr: 1.0e-5

  log:
    run_comment: rain_train_pasts_n=${dataset.n_past}_future_n=${dataset.n_futures}
    log_with_time: True
    visualize_every: 500
    log_every: 10

  debug: False
  #debug: true

val:
  val_duration: 200
  max_val_iters: 10
  vis_samples: 4    # 每次 val 可视化图里展示多少个样本（batch 维）
  vis_n_pasts: 1     # 每个样本展示多少个过去帧（Radar/Satellite/Rain）
  vis_n_futures: 3     # 每个样本展示多少个未来帧（GT/Pred 分类），从 t=0 开始
  # 0 = 严格匹配 (Strict)
  # 1 = 3x3 邻域 (Tolerance 1px)
  # 2 = 5x5 邻域 (Tolerance 2px)
  tolerance_px: 0
